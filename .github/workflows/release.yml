name: Release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            extra_target: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            extra_target: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            extra_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Rust channel
        id: rust-channel
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy, rustfmt
          targets: ${{ matrix.extra_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build macOS Intel release
        if: matrix.extra_target != ''
        run: cargo build --release --locked --target ${{ matrix.extra_target }}
      - name: Check version and pack archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTRA_TARGET: ${{ matrix.extra_target }}
          ARCHIVE: ${{ matrix.archive }}
          RELEASE_CHANNEL: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
        run: |
          set -euo pipefail
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          version_check() {
            local target="$1"
            local bin="target/${target}/release/serial-monitor"
            if [ "$RUNNER_OS" = "Windows" ]; then
              bin="${bin}.exe"
            fi
            local got
            got=$("$bin" --version)
            echo "${target} reports: ${got}"
            test "$got" = "serial-monitor ${crate_version}"
          }
          pack() {
            local target="$1"
            local ext="$2"
            local stage="pack-stage/${target}"
            local bin="target/${target}/release/serial-monitor"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp LICENSE "$stage/LICENSE"
            if [ "$RUNNER_OS" = "Windows" ]; then
              cp "${bin}.exe" "$stage/serial-monitor.exe"
              # Git Bash tar is GNU tar. With -a it does not treat a .zip suffix as
              # zip, so the archive is ustar and Windows cannot open it. System tar
              # is bsdtar, which writes a real zip for that suffix.
              archive="dist/serial-monitor-${RELEASE_CHANNEL}-${target}.${ext}"
              "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -C "$stage" -a -cf "$archive" serial-monitor.exe LICENSE
              sig=$(head -c 2 "$archive")
              test "$sig" = "PK"
            else
              cp "$bin" "$stage/serial-monitor"
              tar -C "$stage" -czf "dist/serial-monitor-${RELEASE_CHANNEL}-${target}.tar.gz" serial-monitor LICENSE
            fi
          }
          mkdir -p dist
          version_check "$TARGET"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$crate_version"
          fi
          if [ -n "$EXTRA_TARGET" ]; then
            file "target/${EXTRA_TARGET}/release/serial-monitor" | grep -q x86_64
          fi
          pack "$TARGET" "$ARCHIVE"
          if [ -n "$EXTRA_TARGET" ]; then
            pack "$EXTRA_TARGET" tar.gz
          fi
      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail
          cd archives
          sha256sum serial-monitor-* | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: archives/SHA256SUMS
      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            archives/serial-monitor-*
            archives/SHA256SUMS
          body: |
            The Linux archive needs `libudev.so.1` at runtime. The binaries are unsigned.

            Verify a download with `sha256sum -c SHA256SUMS` and `gh attestation verify <file> --repo ${{ github.repository }}`.
      - name: Record build time
        id: built
        if: github.ref_type == 'branch'
        run: echo "at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - name: Publish nightly release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: nightly (built ${{ steps.built.outputs.at }})
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            archives/serial-monitor-*
            archives/SHA256SUMS
          body: |
            Built on ${{ steps.built.outputs.at }}.

            Nightly build from `master` at `${{ github.sha }}`.

            This release is replaced on every push to `master`. `serial-monitor --version` prints the version in Cargo.toml. It is not a version number for this rolling release.

            The Linux archive needs `libudev.so.1` at runtime. The binaries are unsigned.

            Verify a download with `sha256sum -c SHA256SUMS` and `gh attestation verify <file> --repo ${{ github.repository }}`.
      - name: Move nightly tag to this commit
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/nightly" -f sha="${GITHUB_SHA}"
          fi
